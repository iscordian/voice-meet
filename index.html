<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Meet</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

.header {
  display: flex;
  justify-content: space-between;
}

.controls {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

button, input {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

#status { margin: 10px 0; color: #94a3b8; }

#signal { font-size: 12px; color: #22c55e; }

.chat {
  background: #1e293b;
  border-radius: 10px;
  padding: 10px;
  height: 250px;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
}

.msg { margin: 5px; padding: 6px; border-radius: 6px; }
.me { background: #2563eb; align-self: flex-end; }
.peer { background: #334155; align-self: flex-start; }

.chat-input {
  display: flex;
  gap: 5px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div>ID: <span id="my-id">...</span></div>
  <div id="signal">Signal: ...</div>
</div>

<div class="controls">
  <input id="peer-id" placeholder="Peer ID (optional)">
  <button onclick="startCall()">Join</button>
  <button onclick="toggleMute()">Mute</button>
</div>

<div id="status">Idle</div>

<div class="chat">
  <div id="messages"></div>
  <div class="chat-input">
    <input id="msg">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
const peer = new Peer();
let localStream;
let peers = {};
let connections = {};
let isMuted = false;

// ROOM
function getRoom() {
  return new URLSearchParams(location.search).get("room");
}

// AUDIO ONLY
navigator.mediaDevices.getUserMedia({ audio: true, video: false })
.then(stream => {
  localStream = stream;
});

// SHOW ID + ROOM LOGIC
peer.on('open', id => {
  document.getElementById("my-id").textContent = id;

  const room = getRoom();

  if (room) {
    if (room !== id) connectToPeer(room);
  } else {
    const link = location.origin + "?room=" + id;
    setStatus("Share: " + link);
  }
});

// CONNECT TO PEER
function connectToPeer(id) {
  if (peers[id]) return;

  const call = peer.call(id, localStream);
  setupCall(call, id);

  const conn = peer.connect(id);
  setupChat(conn, id);

  connections[id] = conn;
}

// RECEIVE CALL
peer.on('call', call => {
  const id = call.peer;
  call.answer(localStream);
  setupCall(call, id);
});

// HANDLE CALL
function setupCall(call, id) {
  peers[id] = call;

  call.on('stream', stream => {
    const audio = new Audio();
    audio.srcObject = stream;
    audio.play();
  });

  monitorConnection(call.peerConnection);
}

// CHAT CONNECTION
peer.on('connection', conn => {
  const id = conn.peer;
  connections[id] = conn;
  setupChat(conn, id);
});

// CHAT
function setupChat(conn, id) {
  conn.on('data', data => {
    if (data.type === "msg") addMsg(data.text, "peer");

    // SHARE PEERS (group feature)
    if (data.type === "peers") {
      data.list.forEach(pid => {
        if (pid !== peer.id) connectToPeer(pid);
      });
    }
  });

  // Send our peers list
  conn.on('open', () => {
    conn.send({
      type: "peers",
      list: Object.keys(peers).concat(peer.id)
    });
  });
}

// SEND MESSAGE
function sendMsg() {
  const input = document.getElementById("msg");
  const text = input.value;
  if (!text) return;

  Object.values(connections).forEach(c => {
    c.send({ type: "msg", text });
  });

  addMsg(text, "me");
  input.value = "";
}

// UI MESSAGE
function addMsg(text, type) {
  const div = document.createElement("div");
  div.textContent = text;
  div.className = "msg " + type;
  document.getElementById("messages").appendChild(div);
}

// START CALL BUTTON
function startCall() {
  const id = document.getElementById("peer-id").value;
  if (id) connectToPeer(id);
}

// MUTE BUTTON
function toggleMute() {
  isMuted = !isMuted;
  localStream.getAudioTracks()[0].enabled = !isMuted;
  setStatus(isMuted ? "Muted" : "Unmuted");
}

// SIGNAL STRENGTH (approximation)
function monitorConnection(pc) {
  setInterval(async () => {
    const stats = await pc.getStats();
    stats.forEach(report => {
      if (report.type === "candidate-pair" && report.state === "succeeded") {
        let quality = "Good";
        if (report.currentRoundTripTime > 0.3) quality = "Weak";
        if (report.currentRoundTripTime > 0.6) quality = "Poor";

        document.getElementById("signal").textContent =
          "Signal: " + quality;
      }
    });
  }, 2000);
}

// STATUS
function setStatus(text) {
  document.getElementById("status").textContent = text;
}
</script>

</body>
  </html>
